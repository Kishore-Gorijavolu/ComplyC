style:
  id: complyc_default
  name: "ComplyC Default C Style"
  version: "1.0"
  description: "Coding guideline for safety-critical embedded C."
  target_language: "C"

  # ComplyC preprocessor mode:
  #   "builtin" -> old regex stripper (no real compiler needed)
  #   "gcc"     -> use GCC -E -P for accurate preprocessing
  preprocessor: "gcc"

rules:
  - id: NAMING_FUNC_001
    title: "Function names must be lower_snake_case"
    scope: function
    check: regex
    pattern: "^[a-z][a-z0-9_]*$"
    severity: major
    guidance: "Rename function to lower_snake_case (e.g. rom_calc_crc16)."
    reference: "§3.2.1 Function Naming"

  - id: NAMING_GLOBAL_001
    title: "Global variables must start with g_"
    scope: file
    check: global_naming
    pattern: "^g_[a-z0-9_]+$"
    severity: major
    guidance: "Prefix global variable names with g_."
    reference: "§3.2.2 Global Variable Naming"

  - id: NAMING_STATIC_001
    title: "File-static variables must start with s_"
    scope: static_variable
    check: regex
    pattern: "^s_[a-z0-9_]+$"
    severity: minor
    guidance: "Prefix file-local static variables with s_."
    reference: "§3.2.3 Static Variable Naming"

  - id: NAMING_MACRO_001
    title: "Macros must be UPPER_SNAKE_CASE"
    scope: macro
    check: regex
    pattern: "^[A-Z][A-Z0-9_]*$"
    severity: major
    guidance: "Use upper_snake_case for macro names."
    reference: "§3.2.4 Macro Naming"

  - id: NAMING_VAR_003
    title: "Variable names must not exceed 31 characters"
    scope: variable
    check: max_length
    max_length: 31
    severity: minor
    guidance: "Shorten names to comply with ANSI C."
    reference: "§2.2 Variable Names"

  - id: NAMING_VAR_004
    title: "Single-letter variable names are forbidden"
    scope: variable
    check: forbid_single_letter
    allowed_exceptions: ["i", "j", "k"]
    severity: minor
    guidance: "Use descriptive names."
    reference: "§2.2 Variable Names"

  - id: FILE_HEADER_001
    title: "Each C file must start with a standard header comment"
    scope: file
    check: file_header_contains
    required_lines:
      - "Module Name:"
      - "Description:"
      - "Author:"
      - "Version:"
    severity: major
    guidance: "Use standard file header."
    reference: "§2.1 File Header Template"

  - id: DOC_FUNC_001
    title: "Public functions must have Doxygen header"
    scope: function
    check: preceding_comment
    requires_doxygen: true
    severity: major
    guidance: "Document public API functions."
    reference: "§4.1 Function Documentation"

  # - id: MAGIC_NUMBER_001
  #   title: "Magic numbers must be replaced with named constants"
  #   scope: literal
  #   check: magic_number
  #   ignore_values: [0, 1, -1]
  #   severity: minor
  #   guidance: "Replace literals with constants."
  #   reference: "§8.1 Magic Numbers"

  - id: FIXEDPOINT_COMMENT_001
    title: "Binary point changes must be documented"
    scope: expression
    check: binary_point_comment_required
    severity: minor
    guidance: "Document binary point transitions."
    reference: "§7.2 Changing Binary Point"

  - id: FORMAT_INDENT_001
    title: "Indentation must be consistent"
    scope: function
    check: consistent_indentation
    severity: minor
    guidance: "Use either tabs or spaces consistently."
    reference: "§3 Indentation"

  - id: FORMAT_BRACE_001
    title: "Curly braces required for all control bodies"
    scope: function
    check: require_braces
    severity: major
    guidance: "Always use braces."
    reference: "§5 Loops"

  - id: BRACE_STYLE_002
    title: "Opening brace must be on its own line"
    scope: file
    check: brace_own_line
    severity: major
    guidance: "Place '{' on a new line."
    reference: "§3 Indentation"

  - id: SAFETY_RECURSION_001
    title: "Recursion is forbidden"
    scope: function
    check: no_recursion
    severity: critical
    guidance: "Rewrite recursive logic."
    reference: "Safety Rule"

  - id: SAFETY_DYNAMIC_MEM_001
    title: "Dynamic memory allocation is forbidden"
    scope: call_expression
    check: forbidden_functions
    functions: ["malloc", "calloc", "realloc", "free"]
    severity: critical
    guidance: "Do not use heap memory."
    reference: "Safety Rule"

  - id: LOOP_INFINITE_001
    title: "Infinite loops are forbidden"
    scope: loop_statement
    check: no_infinite_loops
    severity: critical
    forbidden_patterns:
      - "for(;;)"
      - "while(1)"
      - "while(true)"
    guidance: "Use bounded loops."
    reference: "§12 Infinite Loops"

  - id: FORBIDDEN_GOTO_001
    title: "goto is forbidden"
    scope: function
    check: forbid_keyword
    keyword: "goto"
    severity: major
    guidance: "Use structured flow."
    reference: "§7 Forbidden"

  - id: CTRL_ELSEIF_001
    title: "Every if/else-if chain must end with else"
    scope: if_statement
    check: elseif_must_end_with_else
    severity: major
    guidance: "Add final else."
    reference: "§11 If/Else"

  - id: FUNC_SIZE_001
    title: "Functions must not exceed 40 lines"
    scope: function
    check: max_function_length
    max_lines: 40
    severity: major
    guidance: "Refactor large functions."
    reference: "Industry Practice"

  - id: FUNC_CC_001
    title: "Cyclomatic complexity must not exceed 10"
    scope: function
    check: max_cyclomatic_complexity
    max_cc: 10
    severity: major
    guidance: "Reduce complexity."
    reference: "Industry Practice"

  - id: FUNC_NESTING_001
    title: "Maximum nesting depth is limited to 4"
    scope: function
    check: max_nesting_depth
    max_depth: 4
    severity: major
    guidance: "Flatten logic."
    reference: "Industry Practice"

  - id: FUNC_PARAMS_001
    title: "Functions must not have more than 6 parameters"
    scope: function
    check: max_parameter_count
    max_parameters: 6
    severity: minor
    guidance: "Reduce argument count."
    reference: "Industry Practice"
    
  - id: DEAD_CODE_EMPTY_FUNC_001
    title: "Function body shall not be empty or contain only commented-out code"
    scope: function
    check: empty_function_body
    max_parameters: 6
    severity: major
    guidance: "Reduce argument count."
    reference: "Industry Practice"
  # - id: UNINIT_VAR_001
  #   title: "Variable must be initialized before use"
  #   scope: file
  #   check: dataflow_uninitialized
  #   severity: critical
  #   guidance: "Ensure all variables are assigned on all execution paths before they are read."
  #   reference: "MISRA C:2012 Rule 9.1 (conceptually similar)"

  # - id: DEAD_STORE_001
  #   title: "Dead store – value written but not used"
  #   scope: file
  #   check: dataflow_dead_store
  #   severity: major
  #   guidance: "Remove redundant assignments or use the written value; dead stores may indicate logic bugs or leftover debug code."
  #   reference: "Code quality guideline §4.3 Dead stores"

  # - id: UNUSED_VAR_001
  #   title: "Variable is written but never used"
  #   scope: file
  #   check: dataflow_unused_var
  #   severity: minor
  #   guidance: "Remove unused variables or use them meaningfully to avoid confusion and reduce maintenance risk."
  #   reference: "Code quality guideline §4.2 Unused items"
  - id: MISRA_LITE_ASSIGN_COND_001
    title: "Assignment shall not be used in conditional expressions"
    scope: condition
    check: no_assignment_in_condition
    severity: critical
    guidance: "Use comparison operators in conditions. If assignment is intentional, move it before the condition and test the assigned value explicitly."
    reference: "MISRA C:2012 Rule 13.4 / Rule 14.4 inspired"

  - id: DEAD_CODE_EMPTY_STMT_001
    title: "Empty statements shall not be used"
    scope: control_statement
    check: no_empty_statement
    severity: major
    guidance: "Remove stray semicolons and avoid empty control-flow bodies. If an empty body is intentional, document it clearly."
    reference: "MISRA C:2012 Rule 14.3 / Rule 15.x inspired"
  
  - id: CTRL_EMPTY_BLOCK_001
    title: "Empty control blocks shall contain an intentional-empty comment"
    scope: control_statement
    check: no_empty_block
    severity: minor
    guidance: "If a control block is intentionally empty, add a comment such as 'intentionally empty' or 'no action required'."
    reference: "MISRA C:2012 Rule 15.7 / Rule 14.3 inspired"
    allowed_comments:
      - "intentionally empty"
      - "intentional empty"
      - "no action required"
      - "do nothing"
      - "no operation"
      - "Nothing"

  - id: CTRL_SWITCH_DEFAULT_001
    title: "Switch statements shall have a default label"
    scope: switch_statement
    check: switch_requires_default
    severity: major
    guidance: "Add a default case to handle unexpected values, even if the default only contains a defensive comment or error handling."
    reference: "MISRA C:2012 Rule 16.4 inspired"

  - id: CTRL_SWITCH_FALLTHROUGH_001
    title: "Implicit switch case fall-through is forbidden"
    scope: switch_statement
    check: no_implicit_fallthrough
    allowed_comments:
      - "fall through"
      - "fallthrough"
      - "intentional fallthrough"
    severity: major
    guidance: "Terminate each switch case with break, return, goto, or clearly documented intentional fall-through."
    reference: "MISRA C:2012 Rule 16.3 inspired"

  - id: DEAD_CODE_UNREACHABLE_001
    title: "Unreachable code shall not be present"
    scope: function
    check: no_unreachable_code
    severity: major
    guidance: "Remove statements that can never execute after return, break, continue, or goto."
    reference: "MISRA C:2012 Rule 2.1 inspired"

  - id: SAFETY_FORBIDDEN_API_001
    title: "Unsafe C library functions are forbidden"
    scope: call_expression
    check: forbidden_functions
    functions:
      - "gets"
      - "strcpy"
      - "strncpy"
      - "strcat"
      - "strncat"
      - "sprintf"
      - "vsprintf"
      - "scanf"
      - "sscanf"
      - "fscanf"
    severity: critical
    guidance: "Use bounded, project-approved wrapper APIs instead of unsafe or ambiguous standard library calls."
    reference: "MISRA/CERT secure C practice inspired"

